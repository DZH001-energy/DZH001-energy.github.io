<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Machine learning for energy devices and materials">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFD"/><stop offset="1" stop-color="#EDF3FA"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="40" y="46" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#0E1B2E">Machine learning for energy devices</text>
  <text x="40" y="70" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#6B7C95">Materials screening · device design · lifetime prediction</text>

  <!-- cycle -->
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="44" y="112" width="168" height="76" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
    <text x="128" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Design space</text>
    <text x="128" y="161" text-anchor="middle" font-size="11.5" fill="#0F6E56">catalyst · electrode ·</text>
    <text x="128" y="178" text-anchor="middle" font-size="11.5" fill="#0F6E56">cell architecture</text>

    <rect x="44" y="240" width="168" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
    <text x="128" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Virtual screening</text>
    <text x="128" y="289" text-anchor="middle" font-size="11.5" fill="#185FA5">surrogate models ·</text>
    <text x="128" y="306" text-anchor="middle" font-size="11.5" fill="#185FA5">multi-objective search</text>

    <rect x="316" y="176" width="168" height="76" rx="10" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.6"/>
    <text x="400" y="204" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">ML surrogate</text>
    <text x="400" y="225" text-anchor="middle" font-size="11.5" fill="#185FA5">physics-informed ·</text>
    <text x="400" y="242" text-anchor="middle" font-size="11.5" fill="#185FA5">uncertainty-aware</text>

    <rect x="588" y="112" width="168" height="76" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
    <text x="672" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Prototype</text>
    <text x="672" y="161" text-anchor="middle" font-size="11.5" fill="#854F0B">SOFC cell build ·</text>
    <text x="672" y="178" text-anchor="middle" font-size="11.5" fill="#854F0B">performance test</text>

    <rect x="588" y="240" width="168" height="76" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.4"/>
    <text x="672" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#27500A">Lifetime model</text>
    <text x="672" y="289" text-anchor="middle" font-size="11.5" fill="#3B6D11">degradation curve ·</text>
    <text x="672" y="306" text-anchor="middle" font-size="11.5" fill="#3B6D11">RUL for fleets</text>
  </g>

  <g stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M212 150 L300 190"/><path d="M212 278 L300 238"/>
    <path d="M484 200 L570 160"/><path d="M484 228 L570 268"/>
    <path d="M672 188 L672 236"/>
  </g>
  <path d="M756 150 C 786 150, 786 278, 756 278" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M756 278 C 786 278, 786 150, 756 150" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="792" y="218" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#0F6E56">iterate</text>

  <rect x="44" y="352" width="712" height="56" rx="9" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1"/>
  <text x="64" y="374" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0E1B2E">Accelerated testing</text>
  <text x="64" y="394" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7C95">ML-guided life testing shortens the lab–field loop, connecting battery and fuel-cell datasets in a single workflow</text>
</svg>
