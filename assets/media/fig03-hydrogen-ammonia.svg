<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Hydrogen and ammonia value chain schematic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFD"/><stop offset="1" stop-color="#EDF3FA"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="40" y="46" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#0E1B2E">Hydrogen &amp; ammonia value chain</text>
  <text x="40" y="70" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#6B7C95">From renewable electricity and waste streams to dispatchable power &amp; fuels</text>

  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <!-- renewable electricity -->
    <rect x="42" y="104" width="140" height="62" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.3"/>
    <text x="112" y="130" text-anchor="middle" font-size="13.5" font-weight="600" fill="#27500A">Renewable power</text>
    <text x="112" y="150" text-anchor="middle" font-size="11.5" fill="#3B6D11">solar · wind</text>

    <!-- electrolysis -->
    <rect x="222" y="104" width="140" height="62" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="292" y="130" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0C447C">SOEC / water</text>
    <text x="292" y="150" text-anchor="middle" font-size="11.5" fill="#185FA5">green H₂</text>

    <!-- ammonia -->
    <rect x="402" y="104" width="140" height="62" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="472" y="130" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0C447C">NH₃ synthesis</text>
    <text x="472" y="150" text-anchor="middle" font-size="11.5" fill="#185FA5">Haber–Bosch + model</text>

    <!-- cracking -->
    <rect x="582" y="104" width="150" height="62" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.3"/>
    <text x="657" y="130" text-anchor="middle" font-size="13.5" font-weight="600" fill="#633806">Cracking reactor</text>
    <text x="657" y="150" text-anchor="middle" font-size="11.5" fill="#854F0B">packed-bed · multi-tube</text>

    <!-- SOFC -->
    <rect x="582" y="216" width="150" height="62" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
    <text x="657" y="242" text-anchor="middle" font-size="13.5" font-weight="600" fill="#085041">SOFC + waste heat</text>
    <text x="657" y="262" text-anchor="middle" font-size="11.5" fill="#0F6E56">maritime &amp; stationary power</text>

    <!-- waste -->
    <rect x="42" y="216" width="140" height="62" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
    <text x="112" y="242" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2C2C2A">Waste &amp; biomass</text>
    <text x="112" y="262" text-anchor="middle" font-size="11.5" fill="#5F5E5A">MSW · industrial steam</text>

    <!-- gasification + methanol -->
    <rect x="222" y="216" width="140" height="62" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
    <text x="292" y="242" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2C2C2A">Gasification</text>
    <text x="292" y="262" text-anchor="middle" font-size="11.5" fill="#5F5E5A">syngas + heat</text>

    <rect x="402" y="216" width="140" height="62" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
    <text x="472" y="242" text-anchor="middle" font-size="13.5" font-weight="600" fill="#085041">Methanol</text>
    <text x="472" y="262" text-anchor="middle" font-size="11.5" fill="#0F6E56">methanolation reactor</text>

    <!-- combustion -->
    <rect x="402" y="328" width="140" height="62" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.3"/>
    <text x="472" y="354" text-anchor="middle" font-size="13.5" font-weight="600" fill="#633806">NH₃ combustion</text>
    <text x="472" y="374" text-anchor="middle" font-size="11.5" fill="#854F0B">pre-cracking · kinetics</text>

    <rect x="582" y="328" width="150" height="62" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="657" y="354" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0C447C">CO₂ utilisation</text>
    <text x="657" y="374" text-anchor="middle" font-size="11.5" fill="#185FA5">methanation catalysts</text>
  </g>

  <g stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M182 135 L218 135"/><path d="M362 135 L398 135"/><path d="M542 135 L578 135"/>
    <path d="M182 247 L218 247"/><path d="M362 247 L398 247"/><path d="M657 166 L657 212"/>
    <path d="M112 278 L112 358 L398 358"/>
  </g>
  <g stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arg)">
    <path d="M292 278 L292 300 L657 300 L657 280"/>
    <path d="M542 247 L580 247 L580 359 L546 359"/>
  </g>
  <text x="150" y="176" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6B7C95">H₂</text>
  <text x="386" y="176" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6B7C95">NH₃</text>
  <text x="666" y="196" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#0F6E56">H₂</text>
  <text x="586" y="352" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#0F6E56">CO₂</text>
</svg>
