<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="AI-driven degradation prediction and RUL estimation pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFD"/><stop offset="1" stop-color="#EDF3FA"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="40" y="46" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#0E1B2E">AI-driven diagnostics &amp; lifetime prediction</text>
  <text x="40" y="70" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#6B7C95">From running data to remaining useful life</text>

  <!-- pipeline -->
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="42" y="120" width="130" height="74" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="107" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Run-time data</text>
    <text x="107" y="171" text-anchor="middle" font-size="11.5" fill="#185FA5">voltage · current · T</text>

    <rect x="212" y="120" width="130" height="74" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="277" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Feature &amp; drift</text>
    <text x="277" y="171" text-anchor="middle" font-size="11.5" fill="#185FA5">EIS · ageing cues</text>

    <rect x="382" y="120" width="160" height="74" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
    <text x="462" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Learning core</text>
    <text x="462" y="164" text-anchor="middle" font-size="11.5" fill="#0F6E56">ESN · BLS · neuro-fuzzy</text>
    <text x="462" y="182" text-anchor="middle" font-size="11.5" fill="#0F6E56">ELM-AE + optimiser</text>

    <rect x="582" y="120" width="150" height="74" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.3"/>
    <text x="657" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">RUL estimate</text>
    <text x="657" y="171" text-anchor="middle" font-size="11.5" fill="#854F0B">long-step horizon</text>
  </g>

  <g stroke="#185FA5" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M172 157 L208 157"/><path d="M342 157 L378 157"/><path d="M542 157 L578 157"/>
  </g>

  <!-- degradation curve -->
  <rect x="42" y="240" width="430" height="160" rx="10" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1"/>
  <text x="62" y="266" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0E1B2E">Capacity fade and predicted trend</text>
  <g stroke="#E3EAF3" stroke-width="1">
    <path d="M74 292 L450 292"/><path d="M74 322 L450 322"/><path d="M74 352 L450 352"/><path d="M74 382 L450 382"/>
  </g>
  <path d="M78 296 C 150 306, 210 330, 262 352 C 300 368, 330 376, 356 380" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M78 296 C 150 308, 205 340, 248 374" fill="none" stroke="#0F6E56" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round"/>
  <circle cx="356" cy="380" r="5" fill="#F0A63C"/>
  <path d="M356 380 L356 356" stroke="#F0A63C" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="364" y="352" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#854F0B">failure threshold</text>
  <text x="74" y="398" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#6B7C95">cycle →</text>

  <!-- applications -->
  <rect x="492" y="240" width="240" height="160" rx="10" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1"/>
  <text x="512" y="266" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0E1B2E">Where it is used</text>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#33455F">
    <text x="516" y="292">• health-aware EMS</text>
    <text x="516" y="314">• economic MPC trade-off</text>
    <text x="516" y="336">• warranty &amp; service planning</text>
    <text x="516" y="358">• accelerated life testing</text>
  </g>
  <rect x="516" y="370" width="192" height="18" rx="9" fill="#14C0AE" fill-opacity="0.16"/>
  <text x="612" y="383" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#085041">lab data ↔ field data</text>
</svg>
