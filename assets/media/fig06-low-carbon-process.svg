<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Low-carbon industrial processes and decarbonisation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFD"/><stop offset="1" stop-color="#EDF3FA"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="40" y="46" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#0E1B2E">Low-carbon processes &amp; industrial decarbonisation</text>
  <text x="40" y="70" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#6B7C95">Turning waste streams and renewable electricity into dispatchable fuels</text>

  <!-- three columns -->
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="44" y="108" width="222" height="286" rx="12" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1.2"/>
    <rect x="44" y="108" width="222" height="52" rx="12" fill="#F1EFE8"/>
    <text x="64" y="132" font-size="14" font-weight="600" fill="#2C2C2A">Biomass &amp; MSW</text>
    <text x="64" y="150" font-size="11.5" fill="#5F5E5A">industrial steam boilers</text>
    <text x="64" y="190" font-size="12" fill="#33455F">• gasification modelling</text>
    <text x="64" y="212" font-size="12" fill="#33455F">• combustion simulation</text>
    <text x="64" y="234" font-size="12" fill="#33455F">• syngas quality control</text>
    <text x="64" y="256" font-size="12" fill="#33455F">• waste-to-fuel route</text>
    <rect x="64" y="286" width="182" height="40" rx="8" fill="#E1F5EE" fill-opacity="0.7" stroke="#0F6E56" stroke-width="1"/>
    <text x="155" y="302" text-anchor="middle" font-size="11" fill="#085041">residential &amp; industrial heat</text>
    <text x="155" y="318" text-anchor="middle" font-size="11" fill="#0F6E56">with lower CO₂ intensity</text>

    <rect x="289" y="108" width="222" height="286" rx="12" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1.2"/>
    <rect x="289" y="108" width="222" height="52" rx="12" fill="#E6F1FB"/>
    <text x="309" y="132" font-size="14" font-weight="600" fill="#0C447C">CO₂ utilisation</text>
    <text x="309" y="150" font-size="11.5" fill="#185FA5">methanation &amp; catalysts</text>
    <text x="309" y="190" font-size="12" fill="#33455F">• supported metal catalysts</text>
    <text x="309" y="212" font-size="12" fill="#33455F">• perovskite supports</text>
    <text x="309" y="234" font-size="12" fill="#33455F">• gel-cast synthesis</text>
    <text x="309" y="256" font-size="12" fill="#33455F">• durability screening</text>
    <rect x="309" y="286" width="182" height="40" rx="8" fill="#FAEEDA" fill-opacity="0.8" stroke="#854F0B" stroke-width="1"/>
    <text x="400" y="302" text-anchor="middle" font-size="11" fill="#633806">renewable H₂ + CO₂</text>
    <text x="400" y="318" text-anchor="middle" font-size="11" fill="#854F0B">→ synthetic methane</text>

    <rect x="534" y="108" width="222" height="286" rx="12" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1.2"/>
    <rect x="534" y="108" width="222" height="52" rx="12" fill="#EAF3DE"/>
    <text x="554" y="132" font-size="14" font-weight="600" fill="#27500A">E-fuels</text>
    <text x="554" y="150" font-size="11.5" fill="#3B6D11">power-to-X routes</text>
    <text x="554" y="190" font-size="12" fill="#33455F">• SOEC + methanolation</text>
    <text x="554" y="212" font-size="12" fill="#33455F">• waste-heat integration</text>
    <text x="554" y="234" font-size="12" fill="#33455F">• thermodynamic analysis</text>
    <text x="554" y="256" font-size="12" fill="#33455F">• lifecycle accounting</text>
    <rect x="554" y="286" width="182" height="40" rx="8" fill="#E1F5EE" fill-opacity="0.7" stroke="#0F6E56" stroke-width="1"/>
    <text x="645" y="302" text-anchor="middle" font-size="11" fill="#085041">drop-in fuels for</text>
    <text x="645" y="318" text-anchor="middle" font-size="11" fill="#0F6E56">shipping &amp; aviation</text>
  </g>

  <g stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M266 240 L287 240"/>
    <path d="M511 240 L532 240"/>
  </g>

  <rect x="44" y="408" width="712" height="30" rx="8" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1"/>
  <text x="64" y="428" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7C95">Modelling + experiments together: each route is validated with thermodynamic analysis, numerics and lab data</text>
</svg>
