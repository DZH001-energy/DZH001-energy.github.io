<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Energy management and optimal control for hybrid UAV powertrain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFD"/><stop offset="1" stop-color="#EDF3FA"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="40" y="46" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#0E1B2E">Multi-frequency energy management</text>
  <text x="40" y="70" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#6B7C95">PEMFC · battery · supercapacitor hybrid UAV under hydrogen economy</text>

  <!-- UAV body -->
  <g>
    <rect x="250" y="176" width="300" height="72" rx="36" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.5"/>
    <text x="400" y="207" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0C447C">Hybrid UAV powertrain</text>
    <text x="400" y="228" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#185FA5">lift · cruise · hover transitions</text>
  </g>
  <g stroke="#185FA5" stroke-width="1.4" fill="none">
    <path d="M300 176 L250 132"/><path d="M500 176 L550 132"/>
    <ellipse cx="240" cy="126" rx="34" ry="5"/><ellipse cx="560" cy="126" rx="34" ry="5"/>
  </g>

  <!-- sources -->
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="42" y="152" width="130" height="56" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
    <text x="107" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">PEMFC</text>
    <text x="107" y="195" text-anchor="middle" font-size="11" fill="#185FA5">H₂ tank</text>

    <rect x="42" y="224" width="130" height="56" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.3"/>
    <text x="107" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#27500A">Battery</text>
    <text x="107" y="267" text-anchor="middle" font-size="11" fill="#3B6D11">peak power</text>

    <rect x="628" y="152" width="130" height="56" rx="9" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.3"/>
    <text x="693" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">Supercapacitor</text>
    <text x="693" y="195" text-anchor="middle" font-size="11" fill="#854F0B">transients</text>

    <rect x="628" y="224" width="130" height="56" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.3"/>
    <text x="693" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Load</text>
    <text x="693" y="267" text-anchor="middle" font-size="11" fill="#0F6E56">propeller</text>
  </g>

  <g stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M172 180 L246 200"/>
    <path d="M172 252 L246 226"/>
    <path d="M554 200 L624 180"/>
    <path d="M554 226 L624 252"/>
  </g>

  <!-- EMS controller -->
  <rect x="250" y="300" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="400" y="326" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#085041">Multi-frequency EMS</text>
  <text x="400" y="347" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">ADHDP · Grey–Markov · lifetime-aware</text>
  <path d="M400 248 L400 296" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arg)"/>
  <path d="M400 300 L400 300" stroke="#0F6E56"/>

  <!-- objectives strip -->
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="42" y="300" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1"/>
    <text x="60" y="324" font-size="12.5" font-weight="600" fill="#0E1B2E">Objectives</text>
    <text x="60" y="344" font-size="11.5" fill="#6B7C95">hydrogen economy · RUL-aware</text>
    <text x="60" y="361" font-size="11.5" fill="#6B7C95">efficiency · degradation cost</text>

    <rect x="568" y="300" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1"/>
    <text x="586" y="324" font-size="12.5" font-weight="600" fill="#0E1B2E">Validation</text>
    <text x="586" y="344" font-size="11.5" fill="#6B7C95">simulation · HIL · flight trials</text>
    <text x="586" y="361" font-size="11.5" fill="#6B7C95">duty-cycle scenarios</text>
  </g>
  <path d="M232 335 L246 335" stroke="#C9D6E6" stroke-width="1.4"/>
  <path d="M554 335 L564 335" stroke="#C9D6E6" stroke-width="1.4"/>

  <!-- ageing feedback -->
  <path d="M107 208 L107 386 L246 386" fill="none" stroke="#F0A63C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="160" y="380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#854F0B">degradation feedback</text>
</svg>
