<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Fuel cell modelling and control schematic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFD"/><stop offset="1" stop-color="#EDF3FA"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="40" y="46" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#0E1B2E">Fuel-cell modelling &amp; control loop</text>
  <text x="40" y="70" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#6B7C95">PEMFC · air &amp; thermal management · data-driven MPC</text>

  <!-- stack -->
  <rect x="45" y="150" width="150" height="110" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <text x="120" y="190" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0C447C">PEMFC stack</text>
  <text x="120" y="212" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#185FA5">H₂ / O₂ · 60–120 °C</text>
  <text x="120" y="232" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#185FA5">air · water · heat</text>

  <!-- model -->
  <rect x="270" y="150" width="170" height="110" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="355" y="190" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#085041">Control-oriented model</text>
  <text x="355" y="212" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">LPV · NARMAX ·</text>
  <text x="355" y="230" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">interpretable NN</text>

  <!-- controller -->
  <rect x="515" y="150" width="150" height="110" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
  <text x="590" y="190" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#633806">MPC / fusion</text>
  <text x="590" y="212" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#854F0B">oxygen-starvation</text>
  <text x="590" y="230" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#854F0B">avoidance · thermal</text>

  <path d="M195 205 L266 205" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M440 205 L511 205" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="230" y="192" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6B7C95">measure</text>
  <text x="475" y="192" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6B7C95">predict</text>

  <!-- actuator back to stack -->
  <path d="M590 260 L590 320 L120 320 L120 264" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar2)"/>
  <text x="355" y="341" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#0F6E56">actuator: compressor · humidifier · cooling loop</text>

  <!-- degradation strip -->
  <rect x="45" y="368" width="620" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="1"/>
  <text x="62" y="389" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0E1B2E">Lifetime-aware operation</text>
  <text x="62" y="408" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7C95">degradation trend → RUL → economic MPC → ageing-aware energy management</text>
  <path d="M700 300 l0 56" stroke="#C9D6E6" stroke-width="1"/>
  <circle cx="700" cy="380" r="16" fill="#14C0AE" fill-opacity="0.15" stroke="#0F6E56" stroke-width="1.3"/>
  <text x="700" y="385" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#085041">AI</text>
</svg>
