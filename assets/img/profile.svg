<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#12305A"/>
      <stop offset="0.55" stop-color="#0C1F3A"/>
      <stop offset="1" stop-color="#081426"/>
    </linearGradient>
    <linearGradient id="figure" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#14C0AE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4C8DF6" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C0AE" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#4C8DF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#14C0AE" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7FD8CE" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#14C0AE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#14C0AE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- 人像剪影：头 + 肩，半身构图 -->
  <g fill="url(#figure)">
    <circle cx="400" cy="330" r="132"/>
    <path d="M400 486c-142 0-262 76-286 196-10 50-12 104-12 160v158h596V842c0-56-2-110-12-160-24-120-144-196-286-196Z"/>
  </g>
  <circle cx="400" cy="330" r="132" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="400" cy="330" r="176" fill="none" stroke="#14C0AE" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 9"/>

  <!-- 姓名缩写 -->
  <text x="400" y="360" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="112" font-weight="700" fill="#EAF1FA" fill-opacity="0.92" letter-spacing="-3">ZD</text>

  <!-- 底部说明条 -->
  <rect x="150" y="838" width="500" height="2" fill="#14C0AE" fill-opacity="0.35"/>
  <text x="400" y="884" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="600" fill="#C8D8EA" letter-spacing="4">ZHI HUA DENG</text>
  <text x="400" y="924" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" fill="#7FA0BE" letter-spacing="1.5">REPLACE WITH YOUR PHOTO · 4:5 · 800×1000</text>
</svg>
